# Determinism and portability gates for layer 0–1 crates (ARCHITECTURE.md §2.1,
# TECH_STACK_RESEARCH.md §5.1). Layer 2–3 crates that legitimately need OS
# APIs get their own clippy.toml (clippy uses the nearest one).
# ci/clippy-canary.sh proves these gates are live.

disallowed-methods = [
    # Precision of these is documented as non-deterministic across platforms
    # and Rust versions: use the pinned `libm` crate instead.
    { path = "f64::sin", reason = "non-deterministic; use libm" },
    { path = "f64::cos", reason = "non-deterministic; use libm" },
    { path = "f64::tan", reason = "non-deterministic; use libm" },
    { path = "f64::sin_cos", reason = "non-deterministic; use libm" },
    { path = "f64::asin", reason = "non-deterministic; use libm" },
    { path = "f64::acos", reason = "non-deterministic; use libm" },
    { path = "f64::atan", reason = "non-deterministic; use libm" },
    { path = "f64::atan2", reason = "non-deterministic; use libm" },
    { path = "f64::sinh", reason = "non-deterministic; use libm" },
    { path = "f64::cosh", reason = "non-deterministic; use libm" },
    { path = "f64::tanh", reason = "non-deterministic; use libm" },
    { path = "f64::asinh", reason = "non-deterministic; use libm" },
    { path = "f64::acosh", reason = "non-deterministic; use libm" },
    { path = "f64::atanh", reason = "non-deterministic; use libm" },
    { path = "f64::exp", reason = "non-deterministic; use libm" },
    { path = "f64::exp2", reason = "non-deterministic; use libm" },
    { path = "f64::exp_m1", reason = "non-deterministic; use libm" },
    { path = "f64::ln", reason = "non-deterministic; use libm" },
    { path = "f64::ln_1p", reason = "non-deterministic; use libm" },
    { path = "f64::log", reason = "non-deterministic; use libm" },
    { path = "f64::log2", reason = "non-deterministic; use libm" },
    { path = "f64::log10", reason = "non-deterministic; use libm" },
    { path = "f64::powf", reason = "non-deterministic; use libm" },
    { path = "f64::powi", reason = "non-deterministic; use libm or explicit multiplication" },
    { path = "f64::cbrt", reason = "non-deterministic; use libm" },
    { path = "f64::hypot", reason = "non-deterministic; use libm" },
    { path = "f64::algebraic_add", reason = "non-deterministic by design" },
    { path = "f64::algebraic_sub", reason = "non-deterministic by design" },
    { path = "f64::algebraic_mul", reason = "non-deterministic by design" },
    { path = "f64::algebraic_div", reason = "non-deterministic by design" },
    { path = "f64::algebraic_rem", reason = "non-deterministic by design" },
    { path = "f32::sin", reason = "non-deterministic; use libm" },
    { path = "f32::cos", reason = "non-deterministic; use libm" },
    { path = "f32::tan", reason = "non-deterministic; use libm" },
    { path = "f32::sin_cos", reason = "non-deterministic; use libm" },
    { path = "f32::asin", reason = "non-deterministic; use libm" },
    { path = "f32::acos", reason = "non-deterministic; use libm" },
    { path = "f32::atan", reason = "non-deterministic; use libm" },
    { path = "f32::atan2", reason = "non-deterministic; use libm" },
    { path = "f32::sinh", reason = "non-deterministic; use libm" },
    { path = "f32::cosh", reason = "non-deterministic; use libm" },
    { path = "f32::tanh", reason = "non-deterministic; use libm" },
    { path = "f32::asinh", reason = "non-deterministic; use libm" },
    { path = "f32::acosh", reason = "non-deterministic; use libm" },
    { path = "f32::atanh", reason = "non-deterministic; use libm" },
    { path = "f32::exp", reason = "non-deterministic; use libm" },
    { path = "f32::exp2", reason = "non-deterministic; use libm" },
    { path = "f32::exp_m1", reason = "non-deterministic; use libm" },
    { path = "f32::ln", reason = "non-deterministic; use libm" },
    { path = "f32::ln_1p", reason = "non-deterministic; use libm" },
    { path = "f32::log", reason = "non-deterministic; use libm" },
    { path = "f32::log2", reason = "non-deterministic; use libm" },
    { path = "f32::log10", reason = "non-deterministic; use libm" },
    { path = "f32::powf", reason = "non-deterministic; use libm" },
    { path = "f32::powi", reason = "non-deterministic; use libm or explicit multiplication" },
    { path = "f32::cbrt", reason = "non-deterministic; use libm" },
    { path = "f32::hypot", reason = "non-deterministic; use libm" },
    { path = "f32::algebraic_add", reason = "non-deterministic by design" },
    { path = "f32::algebraic_sub", reason = "non-deterministic by design" },
    { path = "f32::algebraic_mul", reason = "non-deterministic by design" },
    { path = "f32::algebraic_div", reason = "non-deterministic by design" },
    { path = "f32::algebraic_rem", reason = "non-deterministic by design" },

    # Portable core: these compile on wasm32-unknown-unknown but fail at run time,
    # so `cargo check --target wasm32` cannot catch them.
    { path = "std::fs::read", reason = "layer 0-1 crates do no I/O; use kf-store" },
    { path = "std::fs::read_to_string", reason = "layer 0-1 crates do no I/O; use kf-store" },
    { path = "std::fs::write", reason = "layer 0-1 crates do no I/O; use kf-store" },
    { path = "std::fs::create_dir_all", reason = "layer 0-1 crates do no I/O; use kf-store" },
    { path = "std::fs::remove_file", reason = "layer 0-1 crates do no I/O; use kf-store" },
    { path = "std::fs::metadata", reason = "layer 0-1 crates do no I/O; use kf-store" },
    { path = "std::thread::spawn", reason = "no threads in portable crates (wasm is single-threaded)" },
    { path = "std::time::Instant::now", reason = "time comes from recorded timestamps, never a clock" },
    { path = "std::time::SystemTime::now", reason = "time comes from recorded timestamps, never a clock" },
    { path = "std::env::var", reason = "configuration is passed in explicitly" },
]

disallowed-types = [
    { path = "std::fs::File", reason = "layer 0-1 crates do no I/O; use kf-store" },
    { path = "std::fs::OpenOptions", reason = "layer 0-1 crates do no I/O; use kf-store" },
    { path = "std::net::TcpStream", reason = "no network access" },
    { path = "std::net::TcpListener", reason = "no network access" },
    { path = "std::net::UdpSocket", reason = "no network access" },
    { path = "std::process::Command", reason = "no process spawning" },
    { path = "std::time::Instant", reason = "time comes from recorded timestamps, never a clock" },
    { path = "std::time::SystemTime", reason = "time comes from recorded timestamps, never a clock" },
    { path = "std::collections::HashMap", reason = "iteration order is randomised; use BTreeMap or Vec in deterministic code" },
    { path = "std::collections::HashSet", reason = "iteration order is randomised; use BTreeSet or Vec in deterministic code" },
]
