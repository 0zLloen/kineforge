# Supply-chain policy (STACK_DECISION.md §8). Finalise the licence list against
# the real dependency tree as crates are added.

[graph]
all-features = true

[advisories]
yanked = "deny"

[licenses]
allow = ["MIT", "Apache-2.0", "BSD-3-Clause", "Zlib", "Unicode-3.0"]
confidence-threshold = 0.9
# The allow-list is policy declared ahead of the dependencies that need it.
unused-allowed-license = "allow"
# Workspace crates are unpublished (publish = false) and have no licence yet.
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
