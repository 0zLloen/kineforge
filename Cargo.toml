[workspace]
resolver = "3"
members = ["crates/kf-core", "crates/kf-dirgain", "crates/kf-dirgain-oracle", "crates/kf-sim", "crates/kf-telemetry", "crates/kf-store", "crates/kf-cli"]

[workspace.package]
version = "0.0.0"
edition = "2024"
# Equal to the pinned toolchain until an MSRV job exists (STACK_DECISION.md §7).
rust-version = "1.100"
# Licence not chosen yet (STACK_DECISION.md §8); publish = false prevents accidental release.
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kf_canary)"] }

[workspace.lints.clippy]
disallowed_methods = "deny"
disallowed_types = "deny"
