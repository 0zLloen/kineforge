# Native dev tool (not a layer 0-1 crate). Clippy reads only the nearest
# clippy.toml, so this file repeats the root bans; the one difference is that
# std::fs (std::fs::write, File, OpenOptions, ...) is allowed so gen-traces can
# write its output file. Everything that would make a trace or fuzz run
# non-reproducible or platform-dependent stays banned.

