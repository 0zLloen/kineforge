disallowed-types = [
    { path = "std::time::Instant", reason = "runs must be reproducible from their seed" },
    { path = "std::time::SystemTime", reason = "runs must be reproducible from their seed" },
    { path = "std::collections::HashMap", reason = "iteration order is randomised" },
    { path = "std::collections::HashSet", reason = "iteration order is randomised" },
    { path = "std::net::TcpStream", reason = "no network access" },
    { path = "std::net::TcpListener", reason = "no network access" },
    { path = "std::net::UdpSocket", reason = "no network access" },
    { path = "std::process::Command", reason = "no process spawning" },
]
