    { path = "std::time::SystemTime::now", reason = "runs must be reproducible from their seed" },
    { path = "std::env::var", reason = "configuration is passed in explicitly" },
    { path = "std::thread::spawn", reason = "the C engine and its callback state are used single-threaded" },
