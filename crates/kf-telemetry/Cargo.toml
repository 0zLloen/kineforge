[package]
name = "kf-telemetry"
description = "KFLOG v1 raw session log: record codec, recorder, reader, validator, recovery. Pure: no I/O, no clocks."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
kf-core = { path = "../kf-core", features = ["serde"] }
crc32fast = "1.5"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.11"
# Stored members only (DATA_SPECIFICATION.md §4, §12.1).
zip = { version = "9", default-features = false }
arrow-array = { version = "60", optional = true }
arrow-schema = { version = "60", optional = true }
parquet = { version = "60", default-features = false, features = ["arrow", "zstd"], optional = true }

[features]
# Parquet export of derived tables (native).
parquet = ["dep:parquet", "dep:arrow-array", "dep:arrow-schema"]
