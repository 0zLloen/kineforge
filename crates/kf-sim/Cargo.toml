[package]
name = "kf-sim"
description = "KineForge simulation: fixed-tick clock, camera from integer unit totals, seeded RNG, targets, hit tests, static-flick scenario, scoring, replay driver. Pure: no I/O, no clocks."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
kf-core = { path = "../kf-core" }
kf-dirgain = { path = "../kf-dirgain" }
# Exact pin: an algorithm change would change results (STACK_DECISION.md §7).
libm = "=0.2.16"
serde = { version = "1", features = ["derive"], optional = true }

[features]
# (De)serialisation of configs (scenario JSON in the session header).
serde = ["dep:serde"]
